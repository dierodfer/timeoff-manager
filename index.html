<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Gestión de vacaciones del equipo con un calendario centralizado."
    />
    <title>Vacaciones</title>
    <script>
      // Antes del primer pintado: si esperara a React, la pantalla parpadearía
      // en claro durante un instante al abrirla con el tema oscuro guardado.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('timeoff:theme') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
